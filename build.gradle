buildscript {
    repositories { jcenter() }
    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-serialization:1.4.21"
    }
}

plugins {
    id 'java'
    id 'org.jetbrains.kotlin.jvm' version '1.4.21'
    id "org.jetbrains.kotlin.kapt" version "1.4.21"
    id 'org.jetbrains.kotlin.plugin.serialization' version "1.4.21"
    id 'com.github.johnrengelman.shadow' version '5.2.0'
}



group 'com.pepej'
version '1.0-SNAPSHOT'

compileJava.options.encoding = 'UTF-8'

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

repositories {
    jcenter()
    mavenCentral()
    maven { url 'https://libraries.minecraft.net' }
    maven { url 'https://hub.spigotmc.org/nexus/content/groups/public/' }
    maven { url "https://repo.extendedclip.com/content/repositories/placeholderapi/"}
    maven { url "https://repo.dmulloy2.net/nexus/repository/public/"}
}

dependencies {
    implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8")
    implementation("org.jetbrains.kotlinx:kotlinx-serialization-json:1.0.1")
    implementation("org.jdbi:jdbi3-core:3.8.2")
    implementation("org.jdbi:jdbi3-sqlobject:3.8.2")
    implementation("org.jdbi:jdbi3-kotlin:3.8.2")
    implementation("org.jdbi:jdbi3-kotlin-sqlobject:3.8.2")
    compileOnly("com.zaxxer:HikariCP:3.4.5")// will load in runtime
    compileOnly("com.comphenix.protocol:ProtocolLib:4.5.0")
    compileOnly("me.clip:placeholderapi:2.10.9")
    compileOnly("org.spigotmc:spigot-api:1.12.2-R0.1-SNAPSHOT")
    compileOnly("com.mojang:authlib:1.5.21")
    compileOnly fileTree(dir: "libs")
    kapt fileTree(dir: "libs")
    testImplementation("org.junit.jupiter:junit-jupiter-api:5.6.0")
    testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine")
}

compileTestKotlin {
    kotlinOptions.jvmTarget = "1.8"
}

compileKotlin {
    kotlinOptions.jvmTarget = "1.8"
}

test {
    useJUnitPlatform()
}

